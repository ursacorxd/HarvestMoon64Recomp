name: deko3d shaders
on:
  workflow_dispatch:
  push:
    paths:
      - 'switch/deko3d_shaders/**'
      - 'switch/patches/**'
      - '.github/workflows/deko3d-shaders.yml'

jobs:
  survey:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init lib/rt64 lib/RecompFrontend
          git -C lib/rt64 submodule update --init src/contrib/dxc src/contrib/spirv-cross
          echo "SPIRV_CROSS_COMMIT=$(git -C lib/rt64 rev-parse HEAD:src/contrib/spirv-cross)" >> "$GITHUB_ENV"
          apt-get update
          apt-get install -y build-essential cmake python3
          # deko3d y uam ya vienen en la imagen (pkg.devkitpro.org bloquea a GitHub Actions)
          ls -l "$DEVKITPRO/tools/bin/uam"

      # Mismos structs en CPU y GPU, con float3 alineados para que GLSL pueda expresarlos
      - name: Aplicar parche de layout a RT64
        run: git -C lib/rt64 apply "$GITHUB_WORKSPACE/switch/patches/rt64-gl-struct-layout.patch"

      # spirv_cross_dksh se compila contra el spirv-cross fijado por RT64
      - name: Restaurar spirv_cross_dksh desde cache
        id: cache-dksh
        uses: actions/cache/restore@v4
        with:
          path: dksh-tool-bin
          key: dksh-tool-${{ env.SPIRV_CROSS_COMMIT }}-${{ hashFiles('switch/deko3d_shaders/spirv_cross_dksh/**') }}

      - name: Compilar spirv_cross_dksh
        if: steps.cache-dksh.outputs.cache-hit != 'true'
        run: |
          cmake -S switch/deko3d_shaders/spirv_cross_dksh -B /tmp/dksh-tool -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_CROSS_DIR="$GITHUB_WORKSPACE/lib/rt64/src/contrib/spirv-cross"
          cmake --build /tmp/dksh-tool -j"$(nproc)"
          mkdir -p dksh-tool-bin
          cp /tmp/dksh-tool/spirv_cross_dksh dksh-tool-bin/

      - name: Guardar spirv_cross_dksh en cache
        if: steps.cache-dksh.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: dksh-tool-bin
          key: dksh-tool-${{ env.SPIRV_CROSS_COMMIT }}-${{ hashFiles('switch/deko3d_shaders/spirv_cross_dksh/**') }}

      - name: Censo de shaders
        run: |
          DXC_DIR="$GITHUB_WORKSPACE/lib/rt64/src/contrib/dxc"
          chmod +x "$DXC_DIR/bin/x64/dxc-linux"
          LD_LIBRARY_PATH="$DXC_DIR/lib/x64" python3 -I switch/deko3d_shaders/survey.py \
            --rt64 lib/rt64 \
            --recompui lib/RecompFrontend/recompui \
            --dxc "$DXC_DIR/bin/x64/dxc-linux" \
            --dksh-tool "$GITHUB_WORKSPACE/dksh-tool-bin/spirv_cross_dksh" \
            --uam "$DEVKITPRO/tools/bin/uam" \
            --out shader-survey

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shader-survey
          path: shader-survey
