name: Build NRO
on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descargar ROM y verificar estado
        run: |
          echo "Iniciando descarga..."
          curl -L -o hm64.us.z64 "https://docs.google.com/uc?export=download&id=1Z_24D59F1e-s_RuWfim34DTRETZbWcz0"
          
          if head -c 15 hm64.us.z64 | grep -q "<!DOCTYPE"; then
            echo "ERROR: Descargaste una pagina HTML en lugar de la ROM binaria."
            exit 1
          fi

      - name: Compilar herramienta extractora (N64Recomp)
        run: |
          apt-get update && apt-get install -y build-essential cmake git clang lld
          git clone https://github.com/N64Recomp/N64Recomp.git recomp_tool
          cd recomp_tool
          git submodule update --init --recursive
          cmake -B build
          cmake --build build -j4

      - name: Extraer codigo fuente de la ROM y RSP
        run: |
          git config --global --add safe.directory /__w/HarvestMoon64Recomp/HarvestMoon64Recomp
          git submodule update --init --recursive
          
          ./recomp_tool/build/N64Recomp hm64.us.toml
          
          if [ -f "./recomp_tool/build/RSPRecomp" ]; then
            ./recomp_tool/build/RSPRecomp n_aspMain.toml
          else
            ./recomp_tool/build/N64Recomp n_aspMain.toml
          fi

      - name: Parchear codigo C++ para Nintendo Switch
        run: |
          mkdir -p mock_headers
          echo '#pragma once' > mock_headers/dlfcn.h
          echo '#define RTLD_LAZY 1' >> mock_headers/dlfcn.h
          echo '#define RTLD_LOCAL 0' >> mock_headers/dlfcn.h
          echo '#define RTLD_NOW 2' >> mock_headers/dlfcn.h
          echo 'static inline void* dlopen(const char* f, int m) { return 0; }' >> mock_headers/dlfcn.h
          echo 'static inline int dlclose(void* h) { return 0; }' >> mock_headers/dlfcn.h
          echo 'static inline void* dlsym(void* h, const char* n) { return 0; }' >> mock_headers/dlfcn.h
          echo 'static inline char* dlerror(void) { return 0; }' >> mock_headers/dlfcn.h

          # Switch no tiene sys/mman.h: emular mmap de solo lectura leyendo el archivo a memoria
          mkdir -p mock_headers/sys
          cat > mock_headers/sys/mman.h << 'EOF'
          #pragma once
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/types.h>
          #define PROT_NONE 0
          #define PROT_READ 1
          #define PROT_WRITE 2
          #define PROT_EXEC 4
          #define MAP_SHARED 1
          #define MAP_PRIVATE 2
          #define MAP_FAILED ((void*)-1)
          static inline void* mmap(void* addr, size_t len, int prot, int flags, int fd, off_t off) {
              (void)addr; (void)prot; (void)flags;
              char* p = (char*)malloc(len ? len : 1);
              if (!p) return MAP_FAILED;
              if (lseek(fd, off, SEEK_SET) < 0) { free(p); return MAP_FAILED; }
              size_t got = 0;
              while (got < len) {
                  ssize_t r = read(fd, p + got, len - got);
                  if (r <= 0) { free(p); return MAP_FAILED; }
                  got += (size_t)r;
              }
              return p;
          }
          static inline int munmap(void* addr, size_t len) { (void)len; free(addr); return 0; }
          EOF
          
          sed -i '1i include_directories("/opt/devkitpro/portlibs/switch/include/SDL2")' CMakeLists.txt
          sed -i '1i include_directories("${CMAKE_SOURCE_DIR}/mock_headers")' CMakeLists.txt
          # newlib (Switch) tiene FILE::_p, asi que fmt elige la ruta de Apple y usa putc_unlocked, que no existe aqui
          sed -i '1i add_compile_definitions(FMT_USE_FALLBACK_FILE=1)' CMakeLists.txt
          
          find . -type f -name "GamepadMotion.hpp" -exec sed -i '1i #ifndef M_PI\n#define M_PI 3.14159265358979323846\n#endif' {} +
          find . -type f -name "input_events.cpp" -exec sed -i '1i #ifndef M_PI\n#define M_PI 3.14159265358979323846\n#endif' {} +
          
          # WindowHandle solo se define para Win32/Linux/Android/Apple; en Switch usamos SDL_Window* igual que Linux
          find . -type f -name "renderer_context.hpp" -exec sed -i 's/#elif defined(__linux__) || defined(__ANDROID__)/#elif defined(__linux__) || defined(__ANDROID__) || defined(__SWITCH__)/' {} +
          
          find . -type f -name "error_handling.cpp" -exec sed -i 's/std::quick_exit/::quick_exit/g' {} +
          
          find . -type f -name "plume_render_interface_types.h" -exec sed -i 's/static_assert(false, "RenderWindow was not defined for this platform.");/\/\//g' {} +
          find . -type f -name "plume_render_interface_types.h" -exec sed -i '1i typedef void* RenderWindow;' {} +
          find . -type f -name "plume_render_interface.h" -exec sed -i 's/RenderWindow/void\*/g' {} +
          find . -type f -name "plume_vulkan.h" -exec sed -i 's/RenderWindow/void\*/g' {} +
          find . -type f -name "plume_vulkan.cpp" -exec sed -i 's/RenderWindow/void\*/g' {} +
          
          find . -type f -name "lightweightsemaphore.h" -exec sed -i 's/defined(__unix__)/defined(__unix__) || defined(__SWITCH__)/g' {} +
          # rt64_thread: nombre/prioridad de hilo sin implementar en Switch -> no-op
          sed -i 's/static_assert(false, "Unimplemented");/(void)0;/' lib/rt64/src/common/rt64_thread.cpp
          # dxc se ejecuta en el host (x86_64), no en la Switch: elegir el binario segun la arquitectura del host
          sed -i 's/CMAKE_SYSTEM_PROCESSOR STREQUAL "x86_64"/CMAKE_HOST_SYSTEM_PROCESSOR STREQUAL "x86_64"/g' lib/rt64/CMakeLists.txt
          echo 'set_target_properties(nfd PROPERTIES LINKER_LANGUAGE CXX)' >> lib/rt64/src/contrib/nativefiledialog-extended/CMakeLists.txt || true

          # Verificacion: debe aparecer la definicion insertada
          grep -n "WindowHandle" lib/N64ModernRuntime/ultramodern/include/ultramodern/renderer_context.hpp | head

      - name: Compilar herramienta nativa file_to_c para el host
        run: |
          FILE_PATH=$(find . -path "*/tools/file_to_c/file_to_c.cpp" | head -n 1)
          echo "Usando: $FILE_PATH"
          g++ -O3 "$FILE_PATH" -o native_file_to_c

      - name: Compilar juego nativo de Switch (.nro)
        run: |
          cp recomp_tool/build/N64Recomp .
          cp recomp_tool/build/RSPRecomp . || true
          
          mkdir build_switch && cd build_switch
          cp ../recomp_tool/build/N64Recomp .
          cp ../recomp_tool/build/RSPRecomp . || true
          
          cmake -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
            -DFMT_OS=OFF \
            -DPLUTOVG_DISABLE_FONT_FACE_CACHE_LOAD=ON \
            -DZSTD_BUILD_PROGRAMS=OFF \
            ..
          
          cp ../native_file_to_c /usr/bin/file_to_c
          chmod +x /usr/bin/file_to_c
          
          cp ../native_file_to_c file_to_c
          chmod +x file_to_c
          
          make -j4

      - name: Guardar NRO
        uses: actions/upload-artifact@v4
        with:
          name: HM64Recomp-Switch
          path: build_switch/*.nro
