name: Build NRO
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Descargar ROM
        run: curl -L -o baserom.us.z64 "https://files.catbox.moe/yzq3kd.z64"
        
      - name: Compilar el juego
        run: |
          mkdir build && cd build
          cmake -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake ..
          make -j4
          
      - name: Subir archivo final
        uses: actions/upload-artifact@v4
        with:
          name: HM64Recomp-Switch
          path: build/*.nro
