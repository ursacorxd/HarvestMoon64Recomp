name: Build NRO
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Mapa de archivos del proyecto
        run: |
          echo "--- ARCHIVOS EN LA RAIZ ---"
          ls -la
          
          echo "--- ARCHIVOS EN CARPETA TOOLS (Si existe) ---"
          ls -la tools/ || true
          
          echo "--- BUSCANDO SCRIPTS PYTHON Y CONFIGURACIONES ---"
          find . -maxdepth 2 -name "*.py"
          find . -maxdepth 2 -name "*.toml"
          find . -maxdepth 2 -name "*.sh"
