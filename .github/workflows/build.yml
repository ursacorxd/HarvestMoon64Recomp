name: Build NRO
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          
      - name: Descargar ROM y verificar estado
        run: |
          echo "Iniciando descarga..."
          curl -v -L -o hm64.us.z64 "https://docs.google.com/uc?export=download&id=1Z_24D59F1e-s_RuWfim34DTRETZbWcz0"
          
          echo "--- INFORMACIÓN DEL ARCHIVO DESCARGADO ---"
          ls -lh hm64.us.z64
          
          echo "--- PRIMEROS 100 BYTES (Para ver si es una ROM o un error HTML) ---"
          head -c 100 hm64.us.z64
          echo ""
        
      - name: Compilar herramienta extractora (N64Recomp)
        run: |
          apt-get update && apt-get install -y build-essential cmake git
          git clone https://github.com/N64Recomp/N64Recomp.git recomp_tool
          cd recomp_tool
          git submodule update --init --recursive
          cmake -B build
          cmake --build build -j4
          
      - name: Extraer codigo fuente de la ROM
        run: |
          git config --global --add safe.directory /__w/HarvestMoon64Recomp/HarvestMoon64Recomp
          git submodule update --init --recursive
          
          # Verificamos el tamaño exacto del archivo descargado en la bitacora
          ls -lh hm64.us.z64
          
          # Forzamos la ejecucion de la extraccion
          ./recomp_tool/build/N64Recomp hm64.us.toml || ./recomp_tool/build/N64Recomp --no-validate hm64.us.toml
          
          if [ -f "./recomp_tool/build/RSPRecomp" ]; then
            ./recomp_tool/build/RSPRecomp n_aspMain.toml || true
          else
            ./recomp_tool/build/N64Recomp n_aspMain.toml || true
          fi
          
      - name: Compilar juego nativo de Switch (.nro)
        run: |
          mkdir build_switch && cd build_switch
          cmake -G "Unix Makefiles" -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake -DCMAKE_C_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-gcc -DCMAKE_CXX_COMPILER=/opt/devkitpro/devkitA64/bin/aarch64-none-elf-g++ ..
          make -j4
          
      - name: Guardar NRO
        uses: actions/upload-artifact@v4
        with:
          name: HM64Recomp-Switch
          path: build_switch/*.nro
