name: Build NRO
on: [workflow_dispatch]

env:
  ROM_ID: 1Z_24D59F1e-s_RuWfim34DTRETZbWcz0
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "true"

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar dependencias del host
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # github.workspace apunta a la ruta del host, no a la del contenedor
          echo "CCACHE_DIR=$GITHUB_WORKSPACE/.ccache" >> "$GITHUB_ENV"
          apt-get update
          # clang/lld: compilan patches.elf (MIPS). ccache: cache de compilacion. zstd: comprime las caches
          apt-get install -y build-essential cmake git clang lld ccache zstd
          # Commit de N64Recomp fijado por N64ModernRuntime (debe coincidir con los headers que usa el juego)
          echo "N64RECOMP_COMMIT=$(git -C lib/N64ModernRuntime rev-parse HEAD:N64Recomp)" >> "$GITHUB_ENV"

      # ---------- ROM ----------
      - name: Restaurar ROM desde cache
        id: cache-rom
        uses: actions/cache@v4
        with:
          path: hm64.us.z64
          key: rom-${{ env.ROM_ID }}

      - name: Descargar ROM y verificar estado
        if: steps.cache-rom.outputs.cache-hit != 'true'
        run: |
          echo "Iniciando descarga..."
          curl -fL -o hm64.us.z64 "https://drive.usercontent.google.com/download?id=${ROM_ID}&export=download&confirm=t"

          if head -c 512 hm64.us.z64 | grep -qi "<!doctype\|<html"; then
            echo "ERROR: Descargaste una pagina HTML en lugar de la ROM binaria."
            exit 1
          fi
          SIZE=$(stat -c %s hm64.us.z64)
          if [ "$SIZE" -lt 1048576 ]; then
            echo "ERROR: La ROM es demasiado pequena ($SIZE bytes)."
            exit 1
          fi
          sha1sum hm64.us.z64

      # ---------- N64Recomp / RSPRecomp (herramientas del host) ----------
      - name: Restaurar N64Recomp desde cache
        id: cache-tool
        uses: actions/cache@v4
        with:
          path: |
            recomp_tool/build/N64Recomp
            recomp_tool/build/RSPRecomp
          key: n64recomp-${{ runner.os }}-${{ env.N64RECOMP_COMMIT }}

      - name: Compilar herramienta extractora (N64Recomp)
        if: steps.cache-tool.outputs.cache-hit != 'true'
        run: |
          cmake -S lib/N64ModernRuntime/N64Recomp -B recomp_tool/build -DCMAKE_BUILD_TYPE=Release
          cmake --build recomp_tool/build --target N64RecompCLI RSPRecomp -j"$(nproc)"

      # ---------- Codigo extraido de la ROM ----------
      - name: Restaurar codigo extraido desde cache
        id: cache-extract
        uses: actions/cache@v4
        with:
          path: |
            RecompiledFuncs/
            rsp/n_aspMain.cpp
          key: extract-${{ env.N64RECOMP_COMMIT }}-${{ hashFiles('hm64.us.z64', 'hm64.us.toml', 'n_aspMain.toml', 'HarvestMoon64RecompSyms/**') }}

      - name: Extraer codigo fuente de la ROM y RSP
        if: steps.cache-extract.outputs.cache-hit != 'true'
        run: |
          ./recomp_tool/build/N64Recomp hm64.us.toml
          ./recomp_tool/build/RSPRecomp n_aspMain.toml

      - name: Parchear codigo C++ para Nintendo Switch
        run: |
          mkdir -p mock_headers
          echo '#pragma once' > mock_headers/dlfcn.h
          echo '#define RTLD_LAZY 1' >> mock_headers/dlfcn.h
          echo '#define RTLD_LOCAL 0' >> mock_headers/dlfcn.h
          echo '#define RTLD_NOW 2' >> mock_headers/dlfcn.h
          echo 'static inline void* dlopen(const char* f, int m) { return 0; }' >> mock_headers/dlfcn.h
          echo 'static inline int dlclose(void* h) { return 0; }' >> mock_headers/dlfcn.h
          echo 'static inline void* dlsym(void* h, const char* n) { return 0; }' >> mock_headers/dlfcn.h
          echo 'static inline char* dlerror(void) { return 0; }' >> mock_headers/dlfcn.h

          # Switch no tiene sys/mman.h: emular mmap de solo lectura leyendo el archivo a memoria
          mkdir -p mock_headers/sys
          cat > mock_headers/sys/mman.h << 'EOF'
          #pragma once
          #include <stdlib.h>
          #include <unistd.h>
          #include <sys/types.h>
          #define PROT_NONE 0
          #define PROT_READ 1
          #define PROT_WRITE 2
          #define PROT_EXEC 4
          #define MAP_SHARED 1
          #define MAP_PRIVATE 2
          #define MAP_FAILED ((void*)-1)
          static inline void* mmap(void* addr, size_t len, int prot, int flags, int fd, off_t off) {
              (void)addr; (void)prot; (void)flags;
              char* p = (char*)malloc(len ? len : 1);
              if (!p) return MAP_FAILED;
              if (lseek(fd, off, SEEK_SET) < 0) { free(p); return MAP_FAILED; }
              size_t got = 0;
              while (got < len) {
                  ssize_t r = read(fd, p + got, len - got);
                  if (r <= 0) { free(p); return MAP_FAILED; }
                  got += (size_t)r;
              }
              return p;
          }
          static inline int munmap(void* addr, size_t len) { (void)len; free(addr); return 0; }
          EOF

          sed -i '1i include_directories("/opt/devkitpro/portlibs/switch/include/SDL2")' CMakeLists.txt
          sed -i '1i include_directories("${CMAKE_SOURCE_DIR}/mock_headers")' CMakeLists.txt
          # newlib (Switch) tiene FILE::_p, asi que fmt elige la ruta de Apple y usa putc_unlocked, que no existe aqui
          sed -i '1i add_compile_definitions(FMT_USE_FALLBACK_FILE=1)' CMakeLists.txt

          # Solo buscar en el codigo fuente (no en la cache de ccache ni en las herramientas)
          SRC_DIRS="lib src include"

          find $SRC_DIRS -type f -name "GamepadMotion.hpp" -exec sed -i '1i #ifndef M_PI\n#define M_PI 3.14159265358979323846\n#endif' {} +
          find $SRC_DIRS -type f -name "input_events.cpp" -exec sed -i '1i #ifndef M_PI\n#define M_PI 3.14159265358979323846\n#endif' {} +

          # WindowHandle solo se define para Win32/Linux/Android/Apple; en Switch usamos SDL_Window* igual que Linux
          find $SRC_DIRS -type f -name "renderer_context.hpp" -exec sed -i 's/#elif defined(__linux__) || defined(__ANDROID__)/#elif defined(__linux__) || defined(__ANDROID__) || defined(__SWITCH__)/' {} +

          find $SRC_DIRS -type f -name "error_handling.cpp" -exec sed -i 's/std::quick_exit/::quick_exit/g' {} +

          find $SRC_DIRS -type f -name "plume_render_interface_types.h" -exec sed -i 's/static_assert(false, "RenderWindow was not defined for this platform.");/\/\//g' {} +
          find $SRC_DIRS -type f -name "plume_render_interface_types.h" -exec sed -i '1i typedef void* RenderWindow;' {} +
          find $SRC_DIRS -type f -name "plume_render_interface.h" -exec sed -i 's/RenderWindow/void\*/g' {} +
          find $SRC_DIRS -type f -name "plume_vulkan.h" -exec sed -i 's/RenderWindow/void\*/g' {} +
          find $SRC_DIRS -type f -name "plume_vulkan.cpp" -exec sed -i 's/RenderWindow/void\*/g' {} +

          find $SRC_DIRS -type f -name "lightweightsemaphore.h" -exec sed -i 's/defined(__unix__)/defined(__unix__) || defined(__SWITCH__)/g' {} +
          # rt64_thread: nombre/prioridad de hilo sin implementar en Switch -> no-op
          sed -i 's/static_assert(false, "Unimplemented");/(void)0;/' lib/rt64/src/common/rt64_thread.cpp
          # dxc se ejecuta en el host (x86_64), no en la Switch: elegir el binario segun la arquitectura del host
          sed -i 's/CMAKE_SYSTEM_PROCESSOR STREQUAL "x86_64"/CMAKE_HOST_SYSTEM_PROCESSOR STREQUAL "x86_64"/g' lib/rt64/CMakeLists.txt
          echo 'set_target_properties(nfd PROPERTIES LINKER_LANGUAGE CXX)' >> lib/rt64/src/contrib/nativefiledialog-extended/CMakeLists.txt

          # Verificacion: debe aparecer la definicion insertada
          grep -n "__SWITCH__" lib/N64ModernRuntime/ultramodern/include/ultramodern/renderer_context.hpp

      - name: Compilar herramienta nativa file_to_c para el host
        run: |
          FILE_PATH=$(find lib -path "*/tools/file_to_c/file_to_c.cpp" | head -n 1)
          echo "Usando: $FILE_PATH"
          g++ -O2 "$FILE_PATH" -o /usr/local/bin/file_to_c

      # ---------- Cache de compilacion (ccache) ----------
      - name: Restaurar cache de compilacion (ccache)
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-switch-${{ github.sha }}-${{ github.run_id }}
          restore-keys: |
            ccache-switch-${{ github.sha }}-
            ccache-switch-

      - name: Compilar juego nativo de Switch
        run: |
          # patches.toml se ejecuta con ./N64Recomp desde la raiz del repo
          cp recomp_tool/build/N64Recomp .

          ccache --zero-stats
          cmake -S . -B build_switch -G "Unix Makefiles" \
            -DCMAKE_TOOLCHAIN_FILE=/opt/devkitpro/cmake/Switch.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DFMT_OS=OFF \
            -DPLUTOVG_DISABLE_FONT_FACE_CACHE_LOAD=ON \
            -DZSTD_BUILD_PROGRAMS=OFF
          cmake --build build_switch -j"$(nproc)"
          ccache --show-stats

      - name: Empaquetar NRO
        run: |
          cd build_switch
          ELF=$(ls HarvestMoon64Recompiled.elf HarvestMoon64Recompiled 2>/dev/null | head -n 1)
          if [ -z "$ELF" ]; then
            echo "ERROR: no se encontro el ejecutable HarvestMoon64Recompiled"
            exit 1
          fi
          /opt/devkitpro/tools/bin/nacptool --create "Harvest Moon 64 Recompiled" "HarvestMoon64Recomp" "1.0.0" HarvestMoon64Recompiled.nacp
          /opt/devkitpro/tools/bin/elf2nro "$ELF" HarvestMoon64Recompiled.nro --nacp=HarvestMoon64Recompiled.nacp

      - name: Guardar NRO
        uses: actions/upload-artifact@v4
        with:
          name: HM64Recomp-Switch
          path: build_switch/*.nro
          if-no-files-found: error
